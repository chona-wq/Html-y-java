<!DOCTYPE html>
<html>
<head>
    <title>Sumar números</title>
</head>
<body>

    <button onclick="sumar()">Sumar números</button>

    <script>
        function sumar() {
            let a = 5;
            let b = 3;
            let resultado = a + b;

            alert("La suma es: " + resultado);
        }
    </script>

</body>
</html>
